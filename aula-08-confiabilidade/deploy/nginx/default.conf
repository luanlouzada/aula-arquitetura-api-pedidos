upstream orders_backend {
    # least_conn envia a próxima requisição para a instância com menos
    # conexões ativas. Com empates, o NGINX alterna entre as instâncias.
    least_conn;

    # max_fails e fail_timeout implementam verificação passiva: o NGINX aprende
    # com falhas de tráfego real. O script de drain marca uma linha como down
    # antes de enviar SIGTERM, pois esta edição Open Source não consulta /readyz.
    server api-1:8080 max_fails=1 fail_timeout=5s;
    server api-2:8080 max_fails=1 fail_timeout=5s;
    server api-3:8080 max_fails=1 fail_timeout=5s;

    keepalive 32;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://orders_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 500ms;
        proxy_read_timeout 6s;
        proxy_next_upstream error timeout http_502 http_504;
        proxy_next_upstream_tries 2;

        add_header X-Load-Balancer nginx always;
    }
}
