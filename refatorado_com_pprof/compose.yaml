name: aula-pedidos-pprof

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: pedidos_pprof
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pedidos_pprof"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pedidos_pprof_postgres_data:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

volumes:
  pedidos_pprof_postgres_data:
